name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: mutility/ci/.github/workflows/go-test.yaml@main
    with:
      show-coverage: file
      go-version: stable

  publish:
    permissions:
      contents: write
      pull-requests: write
    needs: test
    if: always() && (needs.test.result == 'success')
    uses: mutility/ci/.github/workflows/go-test-publish.yaml@main
    with:
      go-version: stable
